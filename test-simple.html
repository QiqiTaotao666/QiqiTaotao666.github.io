<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单视频测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            color: #00d9ff;
        }
        .video-test {
            margin: 30px 0;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        video {
            width: 100%;
            max-width: 600px;
            display: block;
            margin: 20px 0;
            background: #000;
        }
        .info {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        .success { background: #2d5016; border-left: 4px solid #4caf50; }
        .error { background: #5d1616; border-left: 4px solid #f44336; }
        .warning { background: #5d4316; border-left: 4px solid #ff9800; }
    </style>
</head>
<body>
    <h1>🎥 视频播放测试</h1>
    
    <div class="video-test">
        <h2>测试 1: bodian.mp4 (1.2 MB)</h2>
        <video id="video1" controls>
            <source src="videos/bodian.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="info" id="info1">等待加载...</div>
    </div>

    <div class="video-test">
        <h2>测试 2: bodian2.mp4 (0.8 MB)</h2>
        <video id="video2" controls>
            <source src="videos/bodian2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="info" id="info2">等待加载...</div>
    </div>

    <div class="video-test">
        <h2>测试 3: 相对路径 ./videos/bodian.mp4</h2>
        <video id="video3" controls>
            <source src="./videos/bodian.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="info" id="info3">等待加载...</div>
    </div>

    <div class="video-test">
        <h2>浏览器信息</h2>
        <div class="info">
            <div><strong>User Agent:</strong> <span id="userAgent"></span></div>
            <div><strong>Current URL:</strong> <span id="currentUrl"></span></div>
            <div><strong>Video Support:</strong> <span id="videoSupport"></span></div>
        </div>
    </div>

    <script>
        // 显示浏览器信息
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('currentUrl').textContent = window.location.href;
        
        const testVideo = document.createElement('video');
        const mp4Support = testVideo.canPlayType('video/mp4; codecs="avc1.42E01E"');
        document.getElementById('videoSupport').textContent = 
            mp4Support === 'probably' ? '✅ Full Support' : 
            mp4Support === 'maybe' ? '⚠️ Partial Support' : 
            '❌ Not Supported';

        // 测试每个视频
        function testVideoElement(videoId, infoId) {
            const video = document.getElementById(videoId);
            const info = document.getElementById(infoId);
            const messages = [];

            video.addEventListener('loadstart', () => {
                messages.push('⏳ 开始加载...');
                updateInfo();
            });

            video.addEventListener('loadedmetadata', () => {
                messages.push(`✅ 元数据加载成功`);
                messages.push(`📐 尺寸: ${video.videoWidth}x${video.videoHeight}`);
                messages.push(`⏱️ 时长: ${video.duration.toFixed(2)}秒`);
                info.className = 'info status success';
                updateInfo();
            });

            video.addEventListener('loadeddata', () => {
                messages.push('✅ 数据加载完成');
                updateInfo();
            });

            video.addEventListener('canplay', () => {
                messages.push('✅ 可以播放');
                updateInfo();
            });

            video.addEventListener('error', (e) => {
                const error = video.error;
                let errorMsg = '❌ 错误: ';
                if (error) {
                    switch(error.code) {
                        case 1: errorMsg += 'MEDIA_ERR_ABORTED (加载中止)'; break;
                        case 2: errorMsg += 'MEDIA_ERR_NETWORK (网络错误)'; break;
                        case 3: errorMsg += 'MEDIA_ERR_DECODE (解码失败)'; break;
                        case 4: errorMsg += 'MEDIA_ERR_SRC_NOT_SUPPORTED (格式不支持/文件不存在)'; break;
                        default: errorMsg += '未知错误';
                    }
                }
                messages.push(errorMsg);
                messages.push(`🔍 Source URL: ${video.querySelector('source').src}`);
                info.className = 'info status error';
                updateInfo();
            });

            function updateInfo() {
                info.innerHTML = messages.map(m => `<div>${m}</div>`).join('');
            }

            // 超时检测
            setTimeout(() => {
                if (video.readyState === 0) {
                    messages.push('⚠️ 5秒后仍未加载');
                    info.className = 'info status warning';
                    updateInfo();
                }
            }, 5000);
        }

        testVideoElement('video1', 'info1');
        testVideoElement('video2', 'info2');
        testVideoElement('video3', 'info3');
    </script>

    <div style="margin-top: 30px; text-align: center;">
        <a href="index.html" style="color: #00d9ff; text-decoration: none;">← 返回首页</a>
    </div>
</body>
</html>
